  <rect x="200" y="480" width="400" height="60" rx="30" fill="#1A0F00" stroke="#FFB300" stroke-width="2"/>
  <text x="400" y="517" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFF8E1" text-anchor="middle">WHOLE TURMERIC RHIZOMES</text>
  <text x="400" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#FFB300" text-anchor="middle" letter-spacing="2">DOUBLE POLISHED SALEM RHIZOMES</text>
