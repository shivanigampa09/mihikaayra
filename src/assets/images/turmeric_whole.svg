      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B0000"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Turmeric rhizome roots -->
