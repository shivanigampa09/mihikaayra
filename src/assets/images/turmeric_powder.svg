<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3B00"/>
      <stop offset="50%" stop-color="#2D2200"/>
      <stop offset="100%" stop-color="#140F00"/>
    </linearGradient>
    <radialGradient id="turmeric" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#D48800"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="220" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="6,6" opacity="0.3"/>
  <ellipse cx="400" cy="380" rx="220" ry="80" fill="#000" opacity="0.5"/>
  <!-- Brass/Wooden Bowl -->
  <ellipse cx="400" cy="360" rx="200" ry="100" fill="#8B5A2B" stroke="#D4AF37" stroke-width="4"/>
  <ellipse cx="400" cy="345" rx="185" ry="85" fill="url(#turmeric)"/>
  <!-- Powder Heap -->
  <path d="M 260,340 Q 400,220 540,340 Z" fill="#FFC107" opacity="0.95"/>
  <path d="M 300,330 Q 400,240 500,330 Z" fill="#FFE082" opacity="0.9"/>
  <!-- Turmeric Root -->
  <g transform="translate(180, 380) rotate(-20)">
    <rect x="0" y="0" width="120" height="35" rx="17" fill="#8B5A00" stroke="#D4AF37" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="35" stroke="#5C3A00" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="35" stroke="#5C3A00" stroke-width="3"/>
  </g>
  <rect x="220" y="480" width="360" height="60" rx="30" fill="#1A1400" stroke="#FFD700" stroke-width="2"/>
  <text x="400" y="517" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFF8E1" text-anchor="middle">ORGANIC TURMERIC POWDER</text>
  <text x="400" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#FFD700" text-anchor="middle" letter-spacing="2">HIGH 5%+ NATURAL CURCUMIN</text>
</svg>
